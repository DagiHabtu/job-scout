# Copy to config/profile.yaml and edit. Secrets do NOT go here — they load from env / .env.
profile:
  interests:                          # what you want to work on (spec §12 S11); titles are compared to these
    - "software engineering intern"
    - "systems, infrastructure, cloud or DevOps engineering"
    - "Linux, kernel or open source engineering"
    - "machine learning or AI engineering"
    - "technical research engineering"
    - "frontend, backend or full-stack software engineering"
  # Current preference, not an absolute exclusion: matching titles are still listed, in
  # "Eligible, outside your stated interests" — unless the title also names a strong-interest term.
  not_interested: ["qa", "qc", "quality assurance", "manual testing", "crm", "salesforce"]
  strong_interest_terms: ["linux", "kernel", "systems", "infrastructure", "compiler", "embedded",
                          "distributed", "machine learning", "ml", "ai", "research", "open source"]
  target_technologies: ["python", "sql", "docker", "postgres"]
  employment_types: ["internship", "stipend_program", "new_grad"]
  experience_level: "entry"
  education:                          # candidate stage (spec §12 S10)
    status: "undergraduate"           # undergraduate | graduate
    accept_graduate_programs: false   # graduate-only roles (completed degree required)
    max_required_years: 2             # roles demanding more years of experience are not surfaced
  location:
    country_code: "ET"
    country_name: "Ethiopia"
    city: "Addis Ababa"
    timezone: "Africa/Addis_Ababa"
  remote_preference: "remote"
  work_authorization: ["ET"]          # countries you are ALREADY authorized to work in
  keywords_prioritize: ["open source", "mentorship"]
  keywords_penalize: ["senior", "clearance", "lead"]
  companies_prioritize: []

sources:
  enabled: ["greenhouse"]
  greenhouse_boards: ["gitlab", "stripe"]   # board tokens (public, no auth)
  lever_sites: []
  adzuna_country: "gb"
  adzuna_queries: ["software intern"]

scoring:
  relevance_threshold: 0.45
  eligibility_disqualify_confidence: 0.75

notify:
  mode: "file"                        # "file" (zero-dep) | "email" (Gmail SMTP app password)
  digest_path: "data/digest.html"
