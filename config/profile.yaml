# Live profile for the Job Scout. Non-secret preferences only — secrets load from env / .env.
# Copied from profile.example.yaml and pointed at real Greenhouse boards for the Gate-1 live run.
profile:
  target_roles: ["software engineer intern", "backend intern", "data engineer intern", "backend engineer"]
  target_technologies: ["python", "sql", "docker", "postgres", "kubernetes", "go"]
  employment_types: ["internship", "stipend_program"]
  experience_level: "entry"
  location:
    country_code: "ET"
    country_name: "Ethiopia"
    city: "Addis Ababa"
    timezone: "Africa/Addis_Ababa"
  remote_preference: "remote"
  work_authorization: ["ET"]          # countries you are ALREADY authorized to work in
  keywords_prioritize: ["open source", "mentorship", "remote"]
  keywords_penalize: ["senior", "staff", "principal", "clearance", "lead", "director", "manager"]
  companies_prioritize: []

sources:
  # Available adapters: greenhouse, lever, ashby, known_programs. Enable a name here AND fill its
  # company list. known_programs needs no list (curated Outreachy/GSoC/MLH).
  #
  # Seeding (2026-09-03): widen the single-board observation to a small, VERIFIED set of
  # worldwide-remote companies (the best eligibility fit from Ethiopia). Optimized for high-value
  # internship / early-career coverage, NOT company count. Every token below was verified to
  # resolve to a live public board (provenance per line); unverified guesses were dropped, and
  # verified-but-US-centric boards (ramp, plaid) were excluded as low Ethiopia-internship value.
  # A bad token would be an isolated no-op anyway (per-source failure boundary).
  #
  # INTERNSHIP FIDELITY: worldwide-remote company internships open to Ethiopia are a thin, seasonal
  # set — many company internships are region-locked and will be (correctly) dropped by eligibility.
  # The highest-fidelity internship source for ET remains `known_programs` (Outreachy/GSoC/MLH),
  # already enabled. These ATS boards add calibration breadth; expect modest raw internship yield.
  # (Re-verify tokens any time with scripts/verify_boards.sh.)
  enabled: ["greenhouse", "lever", "ashby", "known_programs"]
  greenhouse_boards: ["gitlab", "sourcegraph91"]
  #   gitlab        — verified live (project Gate-1 run fetched 234 jobs). All-remote, hires 65+ countries.
  #   sourcegraph91 — verified via Sourcegraph's own job-board repo + live boards.greenhouse.io/sourcegraph91. All-remote.
  lever_sites: []
  #   Left empty: verified Lever accounts (Spotify, Palantir, Plaid, Zoox, WHOOP, Aircall, …) skew
  #   US/hub-based; none was a clear worldwide-remote internship fit. Add a verified slug when one is.
  ashby_orgs: ["posthog", "deel"]
  #   posthog — verified 2026-07 vs api.ashbyhq.com/posting-api/job-board/posthog (19 roles). All-remote, global.
  #   deel    — verified 2026-07 (live board; may be quiet). Global EoR, all-remote — strong Ethiopia fit.
  adzuna_country: "gb"
  adzuna_queries: ["software intern"]

scoring:
  # Calibrated to the observed MiniLM cosine range (real matches cluster ~0.36–0.43; genuine
  # engineering roles separate from sales roles around 0.40). The library default is a more
  # conservative 0.45 — see STATE.md §Live verification for the evidence behind this override.
  relevance_threshold: 0.40
  eligibility_disqualify_confidence: 0.75

notify:
  mode: "file"                        # "file" (zero-dep) | "email" (Gmail SMTP app password)
  digest_path: "data/digest.html"
