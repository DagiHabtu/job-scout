[project]
name = "job-scout"
version = "0.0.0"
description = "Autonomous, zero-cost internship/job scout — eligibility-first, deterministic core."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",     # config validation
    "pyyaml>=6",       # preferences file
]

[project.optional-dependencies]
# The ONLY ML dependency, and it is optional: absent it, scoring degrades to lexical (still $0).
embeddings = ["sentence-transformers>=2.2", "numpy"]
dev = ["pytest>=8"]

[project.scripts]
job-scout = "job_scout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
